name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Normal push deployments finish even if another snapshot arrives. A bounded
  # watchdog recovery dispatch may replace a stale environment-waiting run.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          npm ci --ignore-scripts
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Validate generated data and dashboard
        run: |
          python3 -m py_compile scripts/build_dashboard.py scripts/refresh_current_surface.py scripts/watch_mission3_auction.py scripts/validate_dashboard_consistency.py scripts/degen_dogs_runner_health.py scripts/check_remote_freshness.py
          npm run test:dashboard
          npm run validate:dashboard
          npm run check:dashboard-ui

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
