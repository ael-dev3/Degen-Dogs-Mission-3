name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          # Registry advisory/signature endpoints are deliberately excluded from
          # the publication hot path. CI and Dependabot retain dependency alerts;
          # a transient audit outage must not strand time-sensitive auction data.
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Validate generated data and dashboard
        run: bash scripts/run_pages_validation.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEGEN_DOGS_PAGES_EVENT_NAME: ${{ github.event_name }}
          DEGEN_DOGS_PAGES_EVENT_REF: ${{ github.ref }}
          DEGEN_DOGS_PAGES_EVENT_FORCED: ${{ github.event.forced }}
          DEGEN_DOGS_PAGES_EVENT_BEFORE: ${{ github.event.before }}
          DEGEN_DOGS_PAGES_EVENT_AFTER: ${{ github.event.after }}

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify artifact is still current main
        id: freshness
        run: python3 scripts/pages_deploy_controller.py pre
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Recheck main after deployment
        if: steps.freshness.outputs.deploy == 'true' && steps.deployment.outcome == 'success'
        run: python3 scripts/pages_deploy_controller.py post
        env:
          GITHUB_TOKEN: ${{ github.token }}
