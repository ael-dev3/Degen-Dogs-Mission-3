name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Enforce npm vulnerability and registry-signature gates
        timeout-minutes: 3
        run: python3 scripts/run_npm_security_checks.py --attempts 2 --timeout-seconds 30 --retry-delay-seconds 3
      - run: python3 -m py_compile scripts/build_dashboard.py scripts/refresh_current_surface.py scripts/watch_mission3_auction.py scripts/validate_dashboard_consistency.py scripts/refresh_telemetry.py scripts/check_remote_freshness.py scripts/run_npm_security_checks.py
      - run: npm run test:dashboard
      - run: npm run validate:dashboard
      - run: npm run check:dashboard-ui
      - run: npm run build
