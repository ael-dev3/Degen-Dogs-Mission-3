name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: python3 -m py_compile scripts/build_dashboard.py scripts/refresh_current_surface.py scripts/watch_mission3_auction.py scripts/validate_dashboard_consistency.py scripts/refresh_telemetry.py scripts/check_remote_freshness.py
      - run: npm run test:dashboard
      - run: npm run validate:dashboard
      - run: npm run check:dashboard-ui
      - run: npm run build
