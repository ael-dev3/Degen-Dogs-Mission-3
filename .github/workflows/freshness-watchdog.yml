name: Dashboard Freshness Watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard-freshness-watchdog
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRESHNESS_INCIDENT_MARKER: "<!-- degen-dogs-freshness-watchdog:v1 -->"
      FRESHNESS_INCIDENT_TITLE: "[uptime] Degen Dogs dashboard freshness incident"
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check raw-main and Pages freshness
        id: check
        continue-on-error: true
        run: python3 scripts/check_remote_freshness.py --github-output "$GITHUB_OUTPUT"

      - name: Re-dispatch Pages when raw data is newer
        if: ${{ steps.check.outcome == 'success' && steps.check.outputs.pages_needs_deploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Create or update freshness incident
        if: ${{ always() && (steps.check.outcome == 'failure' || steps.check.outputs.incident == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          number="$(
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r \
                --arg title "$FRESHNESS_INCIDENT_TITLE" \
                --arg marker "$FRESHNESS_INCIDENT_MARKER" \
                '[.[][] | select(has("pull_request") | not) | select(.title == $title) | select(.user.login == "github-actions[bot]") | select((.body // "") | contains($marker))][0].number // empty'
          )"
          detail="${REPORT:-freshness check execution failed before a report was produced}"
          body="$(printf '%s\n\nAutomated off-host freshness check failed at %s/%s/actions/runs/%s.\n\n`%s`\n' "$FRESHNESS_INCIDENT_MARKER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$detail")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$FRESHNESS_INCIDENT_TITLE" --body "$body"
          fi

      - name: Close recovered freshness incident
        if: ${{ always() && steps.check.outcome == 'success' && steps.check.outputs.incident == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(
            gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            | jq -r \
                --arg title "$FRESHNESS_INCIDENT_TITLE" \
                --arg marker "$FRESHNESS_INCIDENT_MARKER" \
                '[.[][] | select(has("pull_request") | not) | select(.title == $title) | select(.user.login == "github-actions[bot]") | select((.body // "") | contains($marker))][0].number // empty'
          )"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Freshness recovered in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

      - name: Mark unhealthy run
        if: ${{ always() && (steps.check.outcome == 'failure' || steps.check.outputs.incident == 'true') }}
        run: exit 1
